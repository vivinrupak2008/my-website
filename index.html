<!DOCTYPE html>
<html>
<head>
    <title>Dance Event</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #000000, #16001f);
            color: white;
            text-align: center;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .tag {
            color: #ff4fd8;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 55px;
            margin: 15px 0;
            color: #ffffff;
            text-shadow: 0 0 20px #ff00cc;
        }

        h2 {
            color: #00eaff;
            font-size: 28px;
        }

        .date {
            font-size: 22px;
            color: #ffd700;
            margin: 15px;
        }

        .details {
            background: blue(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            box-shadow: 0 0 30px rgba(255,0,200,0.25);
        }

        .details p {
            font-size: 18px;
            line-height: 1.8;
        }

        .dance {
            font-size: 60px;
            margin: 10px;
        }

        button {
            margin-top: 20px;
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, #ff00cc, #3333ff);
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff00cc;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px #00eaff;
        }

        footer {
            margin-top: 25px;
            color: #aaaaaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="dance">💃 🕺 🎶</div>

        <div class="tag">COME ONN!!!</div>

        <h1>DANCE NIGHT</h1>

        <h2>🔥 Tomorrow is the Day! 🔥</h2>

        <div class="date">
            📅 27 September 2026
        </div>

        <div class="details">

            <p>🎵 Music: DJ Night</p>

            <p>📍 Venue: College Auditorium</p>

            <p>⏰ Time: 5:00 PM onwards</p>

            <p>👥 Open for All Students</p>

            <p>✨ Dance • Music • Fun • Memories ✨</p>

            <button onclick="showMessage()">
                🎉 JOIN THE EVENT
            </button>

        </div>

        <footer>
            © 2026 College Dance Event
        </footer>

    </div>

    <script>
        function showMessage() {
            alert("🎉 Get Ready! Dance Event is Tomorrow! 💃🕺");
        }
    </script>

</body>
</html>
